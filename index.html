<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>決算比較表メーカー</title>
<style>
:root{
  --ink:#1F2A3A; --muted:#6B7787; --line:#D5DBE3; --bg:#EEF1F5; --panel:#FFFFFF;
  --head:#3F5A7E; --accent:#E8604C; --sel:#E6EDF6;
  --ja:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
  --num:"Avenir Next","Avenir","Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ja);font-size:14px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--head);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(380px,460px) 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 22px 60px;overflow:auto;max-height:100vh;position:sticky;top:0}
.main{padding:28px 32px 60px;overflow:auto}
h1{font-size:20px;margin:0 0 4px;font-weight:700;letter-spacing:.02em}
.lead{color:var(--muted);margin:0 0 22px;font-size:13px}

.step{border-top:1px solid var(--line);padding:18px 0 6px}
.step h2{font-size:15px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.step h2 .n{font-family:var(--num);font-weight:600;color:var(--head);font-size:18px;min-width:16px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=url],select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;min-width:0}
input[type=url]{flex:1}
.btn{border:1px solid var(--head);background:var(--head);color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--head)}
.btn.small{padding:3px 9px;font-size:12px;font-weight:500}
select.small{font-size:12px;padding:3px 6px;max-width:190px}
.taginfo{font-size:12px;line-height:1.6;background:#EEF5FB;border:1px solid #CFE0F0;border-radius:8px;padding:6px 10px;margin-bottom:8px;color:#1F3B57}
.btn:disabled{opacity:.45;cursor:default}
.msg{font-size:12px;margin-top:8px}
.msg.err{color:#B3261E}.msg.ok{color:#2E7D4F}

/* 決算データ一覧 */
.filters{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.list{border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto}
.list table{width:100%;border-collapse:collapse;font-size:13px}
.list th{position:sticky;top:0;white-space:nowrap;background:#F6F8FB;text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.list td{padding:6px 8px;border-bottom:1px solid #EEF1F5;white-space:nowrap}
.list tr.on td{background:var(--sel)}
.list tr{cursor:pointer}
.list .num{font-family:var(--num);text-align:right}
.empty{padding:16px;color:var(--muted);font-size:13px}

/* 編集 */
.edit{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px;background:#FBFCFD}
.card .top{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.card .top input.name{flex:1;font-weight:600}
.card .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px}
.card label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.card label input{font-family:var(--num);font-size:13px;color:var(--ink);width:100%}
.card .logo-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.card .logo-row img{height:22px;max-width:90px;object-fit:contain}
.icon{border:none;background:none;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px;font-size:15px;line-height:1}
.icon:hover{background:#E9EDF2;color:var(--ink)}

.settings{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.settings label{font-size:12px;color:var(--muted)}
.clr{display:flex;align-items:center;gap:6px}
.clr input{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}

/* プレビュー */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.bar .t{color:var(--muted);font-size:13px}
.stage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;overflow:hidden}
.fit{transform-origin:top left;width:max-content}
.placeholder{color:var(--muted);padding:80px 20px;text-align:center}

/* 出力する表（PNGになる部分） */
#canvas{background:#fff;padding:28px 24px 30px;display:inline-block;width:max-content;font-family:var(--ja);color:#111}
#canvas h3{text-align:center;font-weight:600;font-size:40px;letter-spacing:1px;margin:0 0 22px;line-height:1.3}
.et{border-collapse:collapse;border:2.5px solid #222}
.et th{background:var(--head);color:#fff;font-weight:500;font-size:26px;line-height:1.25;padding:18px 16px;border-left:1.5px dotted #fff;white-space:nowrap}
.et th:first-child{border-left:none}
.et th small{font-size:21px}
.et td{border-top:1.5px dotted #555;height:136px;padding:8px 18px;vertical-align:middle}
.et td.comp{width:300px;min-width:300px;border-right:1.5px dotted #555;text-align:center;position:relative}
.et td.comp.corner{padding-top:46px}
.et td.comp img{display:block;margin:0 auto;height:64px;max-width:250px;object-fit:contain}
.et td.comp .nm{font-size:21px;font-weight:600;line-height:1.3;margin-top:6px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.et td.comp .lt{font-weight:700;font-size:28px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.et .pc{position:absolute;top:8px;right:14px;font-family:var(--num);font-size:26px}
.et .pd{position:absolute;top:8px;left:14px;font-family:var(--num);font-size:26px;color:#333}
.et .pb{font-size:27px;margin-top:8px;font-weight:500}
.et td.amt{text-align:right;font-family:var(--num);white-space:nowrap;min-width:230px}
.et td.amt b{font-size:46px;font-weight:500;letter-spacing:.5px}
.et td.amt small,.et td.cap small{font-size:26px;font-weight:500}
.et td.yoy{text-align:right;font-family:var(--num);font-size:34px;white-space:nowrap;min-width:170px;border-left:1.5px dotted #bbb}
.et td.mg{color:var(--accent);font-family:var(--num);font-size:40px;text-align:right;white-space:nowrap;min-width:170px}
.et td.cap{border-left:1.5px dotted #555;text-align:right;font-family:var(--num);white-space:nowrap;min-width:200px}
.et td.cap b{font-size:42px;font-weight:500}
.et td.sep{border-left:1.5px solid #888}
.et td.gd,.et td.pg,.et td.nx{text-align:right;font-family:var(--num);white-space:nowrap;min-width:160px;border-left:1.5px dotted #bbb;line-height:1.15}
.et td.gd b,.et td.pg b{font-size:38px;font-weight:600}
.et td.nx b{font-size:32px;font-weight:600}
.et td.nx b small{font-size:20px}
.et td.gd small,.et td.pg small,.et td.nx>small{display:block;font-family:var(--ja);font-size:20px;color:#555;margin-top:4px}
.et td.up b{color:#1E9E5A} .et td.dn b{color:#E0453A}
.et td.yoy.up{color:#1E9E5A;font-family:var(--ja);font-weight:800;font-size:28px} .et td.yoy.dn{color:#E0453A;font-family:var(--ja);font-weight:800;font-size:28px}
/* 金額を左揃えにする */
.et.alignL td.amt,.et.alignL td.cap{text-align:left}
.et.alignL td.amt{padding-left:26px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
  .main{padding:18px 12px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 企業一覧 */
.search{flex:1;min-width:140px}
.list tr.nomaster td{color:#9AA3AE}
.list .sub{color:var(--muted);font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.tab[aria-selected=true]{background:var(--head);border-color:var(--head);color:#fff}
.card select.per{font-family:var(--num);font-size:13px;width:100%}
.src{font-size:11px;color:var(--muted);margin-left:auto}
.warn{margin-top:8px;font-size:12px;color:#8A4B00;background:#FFF4E0;border-radius:6px;padding:6px 8px}
/* セグメント表 */
.et.seg td.sname{text-align:left;font-size:30px;font-weight:600;min-width:330px;border-right:1.5px dotted #555;height:110px;white-space:nowrap}
.et.seg td.sname i{display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:12px;vertical-align:middle}
.et.seg td{height:110px}
.et.seg td.share{color:#444;font-family:var(--num);font-size:34px;text-align:right;min-width:150px;border-left:1.5px dotted #bbb}
.et.seg tr.total td{font-weight:700;border-top:2px solid #333}
#canvas .ttl{display:flex;align-items:center;justify-content:center;gap:22px;margin:0 0 22px}
#canvas .ttl img{height:58px;max-width:240px;object-fit:contain}
#canvas .ttl h3{margin:0}
#canvas .fxnote{font-size:19px;color:#555;margin-top:12px;text-align:right}
#canvas .note{font-size:20px;color:#555;margin-top:12px;text-align:right}
/* 1社まとめ */
@font-face{font-family:"ETNum";src:url(fonts/montserrat-latin-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:"ETNum";src:url(fonts/montserrat-latin-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"ETNum";src:url(fonts/montserrat-latin-800.woff2) format("woff2");font-weight:800}
#canvas.one{width:1250px;padding:34px 34px 26px;--o-bg:#0B0B0B;--o-fg:#fff;--o-ac:#F5C518;--o-mut:#BDBDBD;--o-card:#111;background:var(--o-bg);color:var(--o-fg)}
#canvas.one.light{--o-bg:#fff;--o-fg:#111;--o-ac:var(--head);--o-mut:#555;--o-card:#fff}
#canvas.one .o-n,#canvas.one .o-big,#canvas.one .o-t td,#canvas.one .o-pv b,#canvas.one .bd{font-family:"ETNum",var(--num)}
#canvas.one .o-head{display:flex;align-items:center;justify-content:center;gap:26px;border-bottom:4px solid var(--o-ac);padding-bottom:16px;margin-bottom:22px}
#canvas.one .o-head img{height:92px;max-width:300px;object-fit:contain;background:#fff;border-radius:14px;padding:8px 14px}
#canvas.one .o-head h3{margin:0;font-size:64px;font-weight:900;line-height:1.1;text-align:left;letter-spacing:0}
#canvas.one .o-head .tk{margin-left:18px;padding-left:18px;border-left:6px solid var(--o-ac);font-family:"ETNum",var(--num);font-weight:800}
#canvas.one .o-sub{font-size:40px;font-weight:800;margin-top:6px}
#canvas.one .o-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
#canvas.one .o-grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
#canvas.one .o-grid.g1{grid-template-columns:1fr}
#canvas.one .one1 .o-card{display:grid;grid-template-columns:1fr 1.2fr;column-gap:30px;align-items:center}
#canvas.one .one1 .o-ct,#canvas.one .one1 .o-big{grid-column:1} #canvas.one .one1 .o-prog{grid-column:2;grid-row:1 / span 2}
#canvas.one .one1 .o-ref{grid-column:1 / span 2;margin-top:6px}
#canvas.one .one1 .o-prog{margin-top:64px}
#canvas.one .o-low .o-t{font-size:24px} #canvas.one .o-low .o-t th{font-size:21px} #canvas.one .o-low .o-t td{padding:5px 8px}
#canvas.one .o-big.lg{font-size:78px} #canvas.one .o-big.xl{font-size:62px}
#canvas.one .o-grid.g3 .o-big.lg{font-size:56px} #canvas.one .o-grid.g3 .o-big.xl{font-size:46px}
#canvas.one .o-a5{text-align:right;font-size:24px;font-weight:800;color:var(--o-mut);margin-top:2px}
#canvas.one .o-sm{font-size:.85em;color:var(--o-mut)}
#canvas.one .o-grid.g3 .o-ref{font-size:24px}
#canvas.one .o-grid.g3 .o-ct{max-width:58%}
#canvas.one .o-grid.g3 .bd{font-size:22px;padding:5px 10px}
#canvas.one .o-grid.jpg .bd{position:static;display:inline-block;font-size:23px;padding:4px 12px;margin:10px 0 0 19px}
#canvas.one .o-grid.jpg .o-ct{max-width:100%}
#canvas.one .o-grid.usg .bd{position:static;display:inline-block;font-size:23px;padding:4px 12px;margin:10px 0 0 19px}
#canvas.one .o-grid.usg .o-ct{max-width:100%}
#canvas.one .o-grid.usg .o-ct em{white-space:nowrap}
#canvas.one .o-grid.usg .o-card{min-height:0;padding-bottom:14px}
#canvas.one .o-grid.usg .o-big{margin-top:8px}
#canvas.one .o-grid.usg .o-ref{font-size:22px;white-space:nowrap}
#canvas.one .o-grid.usg.g3 .o-big.lg{font-size:50px} #canvas.one .o-grid.usg.g3 .o-big.xl{font-size:42px}
#canvas.one .o-card{border:3px solid var(--o-ac);border-radius:18px;padding:18px 22px 16px;background:var(--o-card);position:relative;min-height:200px}
#canvas.one .o-ct{display:flex;flex-direction:column;border-left:5px solid var(--o-ac);padding-left:14px;font-size:27px;font-weight:800;line-height:1.2;max-width:62%}
#canvas.one .o-ct span{font-size:24px;font-weight:700;color:var(--o-mut)}
#canvas.one .o-ct em,#canvas.one .o-t em{font-style:normal;font-size:.7em;font-weight:700;margin-left:8px;color:var(--o-mut)}
#canvas.one .bd{position:absolute;top:18px;right:18px;background:var(--o-ac);color:#000;font-size:26px;font-weight:800;padding:6px 14px;border-radius:10px}
#canvas.one .bd.up{background:#2FBF71;color:#fff} #canvas.one .bd.dn{background:#E5484D;color:#fff} #canvas.one .bd.flat{background:#D6E8F7;color:#1F5F8B}
#canvas.one .o-big{font-size:96px;font-weight:800;line-height:1.05;text-align:center;margin:14px 0 6px;white-space:nowrap;letter-spacing:-1px}
#canvas.one .o-grid.g3 .o-big{font-size:68px}
#canvas.one .o-big small{font-family:var(--ja);font-size:.46em;font-weight:900;margin-left:8px;letter-spacing:0}
#canvas.one .o-ref{text-align:center;font-size:25px;font-weight:800;color:var(--o-fg)}
#canvas.one .o-ref small{font-size:1em;margin-left:2px}
#canvas.one .o-low{align-items:start}
#canvas.one .o-sec{border:3px solid var(--o-ac);border-radius:18px;padding:14px 18px 18px;background:var(--o-card)}
#canvas.one .o-sec.wide{margin-bottom:20px}
#canvas.one .o-sec h4{margin:0 0 10px;font-size:34px;font-weight:900}
#canvas.one .o-t{width:100%;border-collapse:collapse;font-size:27px}
#canvas.one .o-t th{background:var(--o-ac);color:#000;font-weight:800;padding:6px 10px;font-size:24px;border:2px solid var(--o-bg)}
#canvas.one.light .o-t th{color:#fff}
#canvas.one .o-t td{border:2px solid #444;padding:6px 12px;text-align:right;font-weight:700;white-space:nowrap}
#canvas.one.light .o-t td{border-color:#ccc}
#canvas.one .o-t td:first-child{text-align:left;font-family:var(--ja);font-weight:800;white-space:normal;max-width:420px}
#canvas.one .o-t td small{font-family:var(--ja);font-size:.75em;margin-left:2px}
#canvas.one .o-t td.up,#canvas.one .o-t span.up{color:#1E9E5A} #canvas.one .o-t td.dn,#canvas.one .o-t span.dn{color:#E0453A}
#canvas.one .o-t .o-prev{color:var(--o-mut);font-weight:600;font-size:.85em}
#canvas.one .o-prog{margin:10px 6px 10px}
#canvas.one .o-bar{position:relative;height:22px;border-radius:11px;background:#333;overflow:visible}
#canvas.one.light .o-bar{background:#E5E5E5}
#canvas.one .o-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:11px;background:var(--o-ac)}
#canvas.one .o-bar u{position:absolute;top:-6px;bottom:-6px;width:4px;background:var(--o-fg);text-decoration:none}
#canvas.one .o-pv{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:26px;font-weight:800;white-space:nowrap}
#canvas.one .o-pv b{font-size:50px}
#canvas.one .o-pv.up b{color:#2FBF71} #canvas.one .o-pv.dn b{color:#FF6B6B}
#canvas.one .o-note{font-size:19px;color:var(--o-mut);text-align:right;margin-top:4px}
#canvas.one .o-chart{margin-bottom:20px;padding-bottom:8px}
#canvas.one .o-cw{display:flex;gap:18px;align-items:stretch}
#canvas.one .o-cw svg{flex:1 1 auto;min-width:0}
#canvas.one .o-qt{flex:0 0 330px;display:flex;flex-direction:column;gap:10px;justify-content:center}
#canvas.one .o-qh{font-size:24px;font-weight:800;color:var(--o-mut);border-left:6px solid var(--o-ac);padding-left:10px}
#canvas.one .o-qr{border:2px solid var(--o-line,#ccc);border-radius:14px;padding:10px 14px 12px}
#canvas.one .o-qr span{display:block;font-size:22px;font-weight:800}
#canvas.one .o-qr b{display:block;font-family:"ETNum",var(--num);font-size:46px;font-weight:900;line-height:1.15}
#canvas.one .o-qr b small{font-family:var(--ja);font-size:.45em;margin-left:4px}
#canvas.one .o-qr em{display:block;font-style:normal;font-size:22px;font-weight:800;font-family:"ETNum",var(--ja)}
#canvas.one .o-qr em.up{color:#1f9d55} #canvas.one .o-qr em.dn{color:#e5484d}
#canvas.one .o-ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#canvas.one .o-ch h4{margin:0}
#canvas.one .o-lg{display:flex;gap:20px;align-items:center;font-size:23px;font-weight:800}
#canvas.one .o-lg i{display:inline-block;width:20px;height:20px;border-radius:5px;margin-right:8px;vertical-align:-2px}
#canvas.one .o-lg em{font-style:normal;color:var(--o-mut);font-size:20px}
#canvas.one .o-none .o-big{color:var(--o-mut)} #canvas.one .o-none .o-ref{color:var(--o-mut)}
#canvas.one .o-empty{font-size:30px;padding:40px;text-align:center}
/* 1社まとめ：全社＋セグメント */
#canvas.one .os-sec{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:900;margin:22px 0 12px}
#canvas.one .os-sec:before{content:"";width:9px;height:32px;background:var(--o-ac);border-radius:3px}
#canvas.one .os-sec span{font-size:17px;font-weight:600;color:var(--o-mut)}
#canvas.one .os-kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
#canvas.one .os-k{border:3px solid var(--o-ac);border-radius:16px;padding:14px 18px;background:var(--o-card)}
#canvas.one .os-kt{font-size:19px;font-weight:800;color:var(--o-mut)}
#canvas.one .os-kv{font-family:"ETNum",var(--num);font-size:48px;font-weight:800;line-height:1.15;margin:6px 0 6px;white-space:nowrap;letter-spacing:-1px}
#canvas.one .os-kv small{font-family:var(--ja);font-size:.42em;font-weight:900;margin-left:4px;letter-spacing:0}
#canvas.one .os-ks{font-size:16px;color:var(--o-mut);margin-top:6px;line-height:1.4}
#canvas.one .os-ks b.up{color:#1E9E5A} #canvas.one .os-ks b.dn{color:#E0453A}
#canvas.one .os-bd{display:inline-block;font-family:"ETNum",var(--ja);font-size:17px;font-weight:800;padding:3px 10px;border-radius:8px;background:#B8C2C6;color:#fff;white-space:nowrap}
#canvas.one .os-bd.up{background:#2FBF71} #canvas.one .os-bd.dn{background:#E5484D} #canvas.one .os-bd.flat{background:#D6E8F7;color:#1F5F8B} #canvas.one .os-bd.na{background:#8A98A0}
#canvas.one .os-next{display:grid;margin-top:14px;border:3px dashed var(--o-ac);border-radius:16px;overflow:hidden}
#canvas.one .os-next>div{padding:12px 18px;border-right:1px solid rgba(128,128,128,.3)} #canvas.one .os-next>div:last-child{border:0}
#canvas.one .os-nl{background:var(--o-ac);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;line-height:1.35}
#canvas.one:not(.light) .os-nl{color:#000}
#canvas.one .os-gt{font-size:16px;font-weight:800;color:var(--o-mut)}

<script type="module">
/* 表を PNG にする（外部ライブラリなし: スタイルをインライン化して SVG foreignObject 経由で canvas に描く） */
async function toDataURL(src){
  if(src.startsWith("data:")) return src;
  const b = await (await fetch(src)).blob();
  return await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
}
function inlineStyles(src, dst){
  if(src.nodeType!==1) return;
  const cs = getComputedStyle(src);
  let css = ""; for(const p of cs) css += `${p}:${cs.getPropertyValue(p)};`;
  dst.setAttribute("style", css);
  for(let i=0;i<src.childNodes.length;i++) inlineStyles(src.childNodes[i], dst.childNodes[i]);
}
/* 画像の中でも同じ欧文フォントが出るように、@font-face を data URL にして埋め込む */
let fontCSS = null;
async function embeddedFonts(){
  if(fontCSS!==null) return fontCSS;
  const out = [];
  for(const sh of document.styleSheets){ let rules; try{ rules = sh.cssRules; }catch{ continue; }
    for(const r of rules){ if(r.type!==CSSRule.FONT_FACE_RULE) continue;
      const m = r.cssText.match(/url\(["']?([^"')]+)["']?\)/); if(!m) continue;
      try{ out.push(r.cssText.replace(m[0], `url(${await toDataURL(new URL(m[1], sh.href||location.href).href)})`)); }catch{}
    } }
  return fontCSS = out.join("\n");
}
async function toPng(node, { pixelRatio=2, backgroundColor="#fff" }={}){
  const w = node.offsetWidth, h = node.offsetHeight;
  const clone = node.cloneNode(true);
  inlineStyles(node, clone);
  clone.style.margin = "0";
  const fc = await embeddedFonts();
  if(fc){ const st = document.createElement("style"); st.textContent = fc; clone.insertBefore(st, clone.firstChild); }
  await Promise.all([...clone.querySelectorAll("img")].map(async im=>{ im.setAttribute("src", await toDataURL(im.getAttribute("src"))); }));
  const xml = new XMLSerializer().serializeToString(clone);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject x="0" y="0" width="100%" height="100%">${xml}</foreignObject></svg>`;
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  await img.decode();
  const c = document.createElement("canvas");
  c.width = Math.ceil(w*pixelRatio); c.height = Math.ceil(h*pixelRatio);
  const ctx = c.getContext("2d");
  ctx.fillStyle = backgroundColor; ctx.fillRect(0,0,c.width,c.height);
  ctx.scale(pixelRatio, pixelRatio); ctx.drawImage(img, 0, 0);
  return c.toDataURL("image/png");
}


const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem("et:"+k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem("et:"+k, JSON.stringify(v)); }catch{} },
};
const state = { mcap: {}, mcapUpdated: "", masters: [], digest: [], logos: {}, rows: [], uploaded: {}, src: "master", cfg: {} };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const truthy = v => v===true || /^(○|〇|◯|1|true|yes|はい|y|on|表示)$/i.test(String(v??"").trim());
const num = v => { if(v==null) return null; if(typeof v==="number") return v; const t=String(v).replace(/[,%％\s]/g,"").replace(/[△▲−]/g,"-"); if(t===""||t==="-") return null; const x=+t; return isNaN(x)?null:x; };
const safe = n => String(n).replace(/[\\/:*?"<>|\s]+/g,"_").replace(/^_+|_+$/g,"");

/* ---------- データ読み込み ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c=='"') q=true; else if(c==','){ row.push(cur); cur=""; }
    else if(c=='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; } else if(c!='\r') cur+=c;
  }
  if(cur!=="" || row.length){ row.push(cur); rows.push(row); }
  const head = (rows.shift()||[]).map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??"").trim()])));
}
/* 小さな読み込みキャッシュ（前回の内容をすぐ出し、裏で取り直す） */
const lcache = {
  get(k, ttl){ try{ const v = JSON.parse(localStorage.getItem("etc:"+k)); if(v && (!ttl || Date.now()-v.t < ttl)) return v; }catch{} return null; },
  set(k, d){ try{ localStorage.setItem("etc:"+k, JSON.stringify({t:Date.now(), d})); }catch{} }
};
function digestFromCSV(t){ return parseCSV(t).map(d=>({...d, 発表日:(d["発表日"]||"").replace(/\//g,"-")})); }
async function loadDigest(sid){
  const c = lcache.get("digest:"+sid);
  if(c?.d){ state.digest = digestFromCSV(c.d); }
  try{
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent("決算データ")}`);
    if(r.ok){ const t = await r.text(); if(!/^\s*</.test(t)){ if(t!==c?.d){ state.digest = digestFromCSV(t); lcache.set("digest:"+sid, t); return true; } } }
  }catch{}
  return !!c?.d;
}
async function loadAll(){
  const j = (u) => fetch(u,{cache:"no-cache"}).then(r=>r.ok ? r.json() : null).catch(()=>null);
  const pc = j("config.json"), pl = j("logos/index.json"), pm = j("data/masters.json"), pk = j("data/mcap.json");
  state.cfg = (await pc) || {};
  const sid = state.cfg.sheetId;
  const pd = sid ? loadDigest(sid) : Promise.resolve(false);   // 決算データのシートは他と並行して読む
  if(sid && state.digest.length && state.src==="digest"){ fillFilters(); renderList(); }   // キャッシュがあれば先に出す
  const [m, lg, mk] = await Promise.all([pm, pl, pk]);
  if(lg) state.logos = lg;
  if(m){ state.masters = m.companies||[]; state.tagOrder = m.tag_order||[]; fillTags();
    $("#dataInfo").textContent = `企業マスター: ${state.masters.filter(c=>c.periods?.length).length}社の業績（${m.updated} 時点）。表に入れた会社は、元の企業マスターのシートから最新の期をその場で読み直します。`;
  } else $("#dataInfo").textContent = "企業マスターのデータを読めませんでした。";
  if(mk){ state.mcap = mk.companies||{}; state.mcapUpdated = mk.updated||""; }
  if(state.mcapUpdated) $("#dataInfo").textContent += ` 時価総額は ${state.mcapUpdated} 時点（1日2回更新）。`;
  fillFilters(); renderList();
  pd.then(ch => { if(ch){ fillFilters(); renderList(); renderPreview(); } });
  return { digest: pd };
}

/* ---------- 期の扱い ---------- */
function parsePeriod(p){
  const t = String(p||"").trim(); let m;
  if((m = t.match(/FYE?\s*'?(\d{4}|\d{2})\s*\/\s*\d{1,2}\s*[-_ ]?\s*(?:Q\s*([1-4])|([1-4])\s*Q)/i))) return [fy4(m[1]), +(m[2]||m[3])];
  if((m = t.match(/^([1-4])\s*Q\s*'?(\d{4}|\d{2})$/i))) return [fy4(m[2]), +m[1]];
  if(!/^(Q|第)/i.test(t) && (m = t.match(/(?:FYE?|CY)?\s*'?(\d{4}|\d{2})\s*[-_/. ]?\s*(?:年度?)?\s*(?:Q|第)\s*([1-4])/i))) return [fy4(m[1]), +m[2]];
  if((m = t.match(/(?:Q|第)\s*([1-4])(?:四半期)?\s*[-_/. ]?\s*(?:FYE?|CY)?\s*'?(\d{4}|\d{2})/i))) return [fy4(m[2]), +m[1]];
  if((m = t.match(/(\d{4}|\d{2})\s*[-_/. ]?\s*([1-4])\s*Q/i))) return [fy4(m[1]), +m[2]];
  return [null,null];
}
const fy4 = y => { y=+y; return y<100 ? y+2000 : y; };
/* 期の表記を「Q1〜Q4」にそろえる（第3四半期 / 3Q / FY27 1Q / 3Q（速報） → Q3 / Q3（速報）） */
const ZEN = {"１":"1","２":"2","３":"3","４":"4","一":"1","二":"2","三":"3","四":"4"};
function qLabel(p){
  const t = String(p??"").trim(); if(!t) return t;
  const n = t.replace(/[１-４]/g, c=>ZEN[c]);
  const k = n.match(/第\s*([1-4一二三四])\s*四半期/);
  const m = (k && [k[0], ZEN[k[1]]||k[1]]) || n.match(/(?:^|[^0-9])([1-4])\s*Q(?![0-9])/i) || n.match(/Q\s*([1-4])/i);
  if(!m) return t;
  const extra = (n.match(/[（(][^）)]*[）)]/)||[""])[0];
  return "Q"+m[1]+extra;
}
const yoyOf = (a,b) => (a==null||b==null||b<=0) ? null : Math.round((a/b-1)*1000)/10;

/* ---------- 一覧 ---------- */
const masterOf = r => state.masters.find(c => (r.ticker && c.ticker===r.ticker) || c.ja===r.企業 || c.name===r.企業);
/* 利益の欄が税引前利益の会社（総合商社など。企業マスターに営業利益がなく profit_before_tax を使っている） */
const isPbt = r => masterOf(r)?.profit_kind==="pbt";

/* カテゴリー（ウォッチリストのAV列〜の 1 の付いた列）で一括選択 */
/* 決算の発表状況: ウォッチリストの決算日が今日以降なら「未発表（予定日）」、過去100日以内なら「発表済み」、それ以外は「日程未定」 */
function tagStatus(tag){
  const today = new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  const ago = d => (Date.parse(today) - Date.parse(d)) / 864e5;
  const cs = state.masters.filter(c => (c.tags||[]).includes(tag));
  const st = { n: cs.length, done: [], pending: [], unknown: [] };
  for(const c of cs){
    const d = /^\d{4}-\d{2}-\d{2}$/.test(c.date||"") ? c.date : "";
    const name = c.ja || c.name;
    if(d && d >= today) st.pending.push({ name, date: d });
    else if(d && ago(d) <= 100) st.done.push({ name, date: d });
    else st.unknown.push({ name });
  }
  st.pending.sort((a,b)=>a.date.localeCompare(b.date));
  st.allBy = st.pending.length && !st.unknown.length ? st.pending.at(-1).date : "";
  return st;
}
const md = d => d ? `${+d.slice(5,7)}/${+d.slice(8,10)}` : "";
function tagLabel(t){
  const s = tagStatus(t);
  const tail = !s.pending.length && !s.unknown.length ? "全社発表済み" : s.allBy ? `${md(s.allBy)}にそろう` : "日程未定あり";
  return `${t}（${s.done.length}/${s.n}社 発表済み・${tail}）`;
}
function tagInfoHTML(t){
  const s = tagStatus(t);
  if(!s.pending.length && !s.unknown.length) return `<b>${esc(t)}</b>：${s.n}社すべて最新の決算を発表済みです（最後は ${md(s.done.map(x=>x.date).sort().at(-1))}）。`;
  return `<b>${esc(t)}</b>：${s.done.length}/${s.n}社 発表済み。` +
    (s.pending.length ? ` 未発表：${s.pending.map(x=>`${esc(x.name)}（${md(x.date)}予定）`).join("、")}。` : "") +
    (s.unknown.length ? ` 日程未定：${s.unknown.map(x=>esc(x.name)).join("、")}。` : "") +
    (s.allBy ? ` <b>${md(s.allBy)}</b>に全社そろう見込み。` : "");
}

function splitUnit(u){ const m = String(u||"").match(/^(百万|10億|十億|億|兆)(.+)$/); return m ? { mult:PREFIX[m[1]], code:CUR_CODE[m[2]] || null, name:m[2] } : null; }

function yenValue(v, unit){

    .sort((a,b)=> (a.v==null)-(b.v==null) || (a.v==null ? 0 : (a.v-b.v)*dir) || a.i-b.i).map(x=>x.r);

/* ---------- ガイダンス・進捗率（企業マスターの「進捗・比較」タブ → masters.json の guide） ---------- */
function rowPeriod(r){   // 行の期（FY2027Q2 など）。自動まとめの行はマスターの同じラベルの最新期
  if(r.period && r.period!=="dg") return r.period;
  const c = masterOf(r); if(!c?.periods?.length) return "";
  const lb = qLabel(r.期); const hit = [...c.periods].reverse().find(p=>p.label===lb);
  return hit?.period || "";
}
const gKey = s => String(s||"").replace(/\s/g,"").toUpperCase().replace(/^FY/,"");
const GAAPISH = b => !/non/i.test(b||"");
function metricOf(r, which){ return which==="rev" ? "revenue" : (isPbt(r) ? "profit_before_tax" : "operating_profit"); }
/* その会社の guide 行（type・期・指標で絞る）。基準は GAAP 系を優先し、なければ Non-GAAP */
function guideFind(c, type, period, metric){
  const per = gKey(period);
  const hits = (c?.guide||[]).filter(g => g.type===type && gKey(g.period)===per && g.metric===metric);
  return hits.find(g=>GAAPISH(g.basis)) || hits[0] || null;
}
/* 予想比: 決算発表前に出ていた会社ガイダンス（レンジは中央値）と実績の比較 */
function guideCompare(r, which){
  const man = num(r[which==="rev" ? "売上高予想比" : "営業利益予想比"]); if(man!=null) return { pct:man };
  const g = guideFind(masterOf(r), "ガイダンス比較", rowPeriod(r), metricOf(r, which));
  return g && g.ratio!=null ? { pct:g.ratio, band:g.judge, basis:g.basis, g } : null;
}
/* 進捗率: 通期の会社予想に対する累計実績（avg5 = 過去5年の同じ四半期時点の平均） */
function progressOf(r, which){
  const man = num(r[which==="rev" ? "売上高進捗率" : "営業利益進捗率"]); if(man!=null) return { pct:man };
  const g = guideFind(masterOf(r), "通期進捗", rowPeriod(r), metricOf(r, which));
  return g && g.ratio!=null ? { pct:g.ratio, avg5:g.avg5, judge:g.judge, basis:g.basis, g } : null;
}
function progress(r, which){ return progressOf(r, which)?.pct ?? null; }

function nextGuide(r, metric="revenue", span="quarter"){
  const c = masterOf(r); if(!c?.guide) return null;
  const [fy, q] = parsePeriod(rowPeriod(r) || c.periods?.at(-1)?.period || "");
  const isQ = p => /Q[1-4]$/i.test(p);
  const cand = c.guide.filter(g => g.type==="次期ガイダンス" && g.metric===metric && (span==="quarter" ? isQ(g.period) : !isQ(g.period) && !/H1$/i.test(g.period)));
  const ord = g => { const [f2,q2] = parsePeriod(g.period); const fy2 = f2 || +String(g.period).replace(/\D/g,"").slice(0,4); return fy2*10 + (q2||5); };
  const after = cand.filter(g => !fy || ord(g) > fy*10 + (span==="quarter" ? (q||0) : 0)).sort((a,b)=>ord(a)-ord(b));
  return after.find(g=>GAAPISH(g.basis)) || after[0] || null;
}

const unitOfG = (g, amtUnit) => g.amount ? amtUnit : ({USD:"ドル", "$":"ドル", JPY:"円", EUR:"ユーロ", KRW:"ウォン", TWD:"台湾ドル", CNY:"元", HKD:"香港ドル", "％":"%"}[g.unit] || g.unit || "");

function bigAmt(v, unit, m){

/* シートが年度を「始まる年」で呼んでいるとき（FY2026 = 2026年4月〜2027年3月）は、決算期の表示を終わる年に直す。

const fyOffCache = new Map();
function fyOffset(c){
  if(fyOffCache.has(c)) return fyOffCache.get(c);

  const fe = fyEndM(c), last = (c.periods||[]).at(-1),
    d = String(latestEarn(c) || (c.date && c.date <= today ? c.date : "")).slice(0,10);
  const [fy, q] = parsePeriod(last?.period||"");
  if(fe && fy && q && /^\d{4}-\d{2}-\d{2}$/.test(d)){
    const qm = ((fe - 1 + 3*q) % 12) + 1;                      // 四半期末の月
    const dy = +d.slice(0,4), dm = +d.slice(5,7);
    const qy = qm <= dm ? dy : dy - 1;                          // 発表日より前の、その月の年
    const endYear = qm <= fe ? qy : qy + 1;                     // その四半期を含む年度が終わる年
    if(Math.abs(endYear - fy) === 1) off = endYear - fy;

}

}

    if(b < 0 && a < 0) return a > b ? { t:"赤字縮小", cls:"up" } : a < b ? { t:"赤字拡大", cls:"dn" } : { t:"赤字継続", cls:"" };

/* 日本企業の通期決算: 上に通期実績カード（前期比・来期予想つき）、真ん中にグラフ、下に来期の会社予想の表 */

    const sum = k ? sumFY(fy, k) : null, prev = k ? sumFY(fy-1, k) : null;

    const items = [["前年同期", prev.operating_profit, null], ...ch, ["調整・その他", adj, "#888"], ["今期", cur.operating_profit, null]];
    const BW = 400, BH = 360, vals = [prev.operating_profit]; let cu = prev.operating_profit;
    for(const [, v] of [...ch, ["", adj]]){ cu += v; vals.push(cu); }
    const vmin = Math.min(0, ...vals) < 0 ? Math.min(...vals) * 1.1 : Math.min(...vals) * 0.7, vmax = Math.max(...vals) * 1.1;
    const yy = v => BH - 100 - (v - vmin) / ((vmax - vmin) || 1) * (BH - 130);
    const bw = BW / items.length; let g = ""; cu = prev.operating_profit;
    items.forEach(([lab, v, col], i) => {
      const x = i*bw + 4, w = bw - 8;
      const y0 = yy(Math.max(vmin, 0));   // 合計の棒は目盛りの下端（0 より上で切っている場合はそこ）から
      if(col==null){ g += `<rect x="${x}" y="${yy(Math.max(v,0))}" width="${w}" height="${Math.max(2, Math.abs(yy(v)-y0))}" rx="3" fill="${dark?"#F5C518":"var(--o-ac)"}"/><text x="${x+w/2}" y="${yy(Math.max(v,0))-8}" text-anchor="middle" font-size="14" font-weight="800" fill="${fg}">${short(v)}</text>`; }
      else { const a = cu, b = cu + v, tp = Math.max(a,b), bt = Math.min(a,b);
        g += `<rect x="${x}" y="${yy(tp)}" width="${w}" height="${Math.max(2, yy(bt)-yy(tp))}" rx="3" fill="${v>=0 ? col : "#D24343"}"/><text x="${x+w/2}" y="${yy(tp)-8}" text-anchor="middle" font-size="13" font-weight="800" fill="${v>=0?"#1B9A57":"#D24343"}">${v>=0?"+":m}${short(Math.abs(v))}</text>`; cu = b; }
      const s = lab.length > 9 ? lab.slice(0, 8) + "…" : lab;
      g += lab.length <= 4 ? `<text x="${x+w/2}" y="${BH-80}" text-anchor="middle" font-size="13" font-weight="700" fill="${fg}">${esc(s)}</text>`
        : `<text x="${x+w/2+4}" y="${BH-88}" text-anchor="end" font-size="13" font-weight="700" fill="${fg}" transform="rotate(-40 ${x+w/2+4} ${BH-88})">${esc(s)}</text>`;
    });
    bridge = `<div class="os-box"><h4>${opName}の増減（前年同期比）をセグメント別に</h4><svg viewBox="0 0 ${BW} ${BH}" width="100%" style="display:block;font-family:ETNum,var(--num)">${g}</svg></div>`;
  } else if(!wide){
    bridge = `<div class="os-box"><h4>${opName}の増減</h4><div class="os-none" style="padding:40px 0">前年同期のセグメント利益がないため、分解できません</div></div>`;
  }
  h += wide ? chart : `<div class="os-two">${chart}${bridge}</div>`;
  // --- セグメント表 or 主要な数字
  if(segs.length){
    const tot = segs.reduce((s,x) => s + Math.max(0, x.rev), 0);
    const top = many ? segs.slice(0, 6) : segs, restV = tot - top.reduce((s,x) => s + Math.max(0, x.rev), 0);
    const fits = (name, share) => share * 1180 >= [...name].reduce((s,ch) => s + (ch.charCodeAt(0) > 255 ? 16 : 9.5), 0) + 56;
    const piece = (name, v, col) => { const sh = v / tot; return `<div style="flex:${Math.max(0,v)};background:${col}">${fits(name, sh) ? `${esc(name)} ${(sh*100).toFixed(0)}%` : ""}</div>`; };
    const comp = top.map(s => piece(s.name, s.rev, s.color)).join("") + (many && restV > 0 ? piece("ほか", restV, "#9AA7AC") : "");
    const nh = many ? 5 : 8;
    const spark = (vals, col) => {
      const v = vals.slice(-nh); if(v.filter(x => x!=null).length < 4) return `<span class="os-mut">データ不足</span>`;
      const sw = many ? 150 : 230, sh = many ? 30 : 54, mxv = Math.max(...v.filter(x=>x!=null).map(Math.abs), 1), bw = sw / v.length;
      return `<svg width="${sw}" height="${sh}">${v.map((x, i) => x==null ? "" : `<rect x="${i*bw+2}" y="${x>=0 ? sh - Math.max(1, Math.abs(x)/mxv*(sh-4)) : sh-2}" width="${bw-5}" height="${Math.max(1, Math.abs(x)/mxv*(sh-4))}" rx="2" fill="${x>=0?col:"#D24343"}" opacity="${i===v.length-1?1:.35}"/>`).join("")}</svg>`;
    };
    const rows = segs.map(s => {
      const smg = s.op!=null && s.rev ? s.op/s.rev*100 : null, pmg = s.opp!=null && s.rp ? s.opp/s.rp*100 : null, dd = smg!=null && pmg!=null ? smg - pmg : null;
      return `<tr><td><i style="background:${s.color}"></i>${esc(s.name)}</td><td class="n">${amt(s.rev)}</td><td>${osBadge(osChg(s.rev, s.rp), m)}</td>`
        + (hasP ? `<td class="n">${s.op==null ? "-" : amt(s.op)}</td><td>${osBadge(osChg(s.op, s.opp), m)}</td><td class="n">${smg==null ? "-" : `${smg<0?m:""}${Math.abs(smg).toFixed(1)}<small>%</small>`}${dd!=null ? `<div class="os-dd ${signCls(dd)}">${dd>=0?"+":m}${Math.abs(dd).toFixed(1)}pt</div>` : ""}</td><td>${spark(s.hist, s.color)}</td>` : "")
        + `</tr>`; }).join("");
    h += `<div class="os-sec">セグメント業績 <span>${jp ? `第${qn}四半期（3か月）` : "直近の四半期（3か月）"}・前年同期比・${segs.length}セグメント</span></div><div class="os-comp">${comp}</div>
      <table class="os-t ${many ? "dense" : segs.length <= 3 ? "roomy" : ""}"><tr><th>セグメント</th><th>売上</th><th>前年比</th>${hasP ? `<th>利益</th><th>前年比</th><th>利益率</th><th>利益の推移（${nh}四半期）</th>` : ""}</tr>${rows}</table>`;
  } else {
    const key = [["revenue","売上高"],["operating_profit",opName],["ordinary_profit","経常利益"],["profit_before_tax","税引前利益"],["net_income","純利益"],["eps","EPS"]]
      .filter(([kk], i, a) => !(pbt && kk==="profit_before_tax") && cur[kk]!=null);
    const rows = key.map(([kk, lab]) => {
      const mt = kk==="operating_profit" ? opMt : kk, gf = fyG.find(g => g.metric===mt) || prog.find(g => g.metric===mt), pg = prog.find(g => g.metric===mt && g.ratio!=null);
      const gq = cmp.find(g => g.metric===mt);
      const v = kk==="eps" ? valHTML(cur.eps, { metric:"eps", amount:false, unit:c.currency||"JPY" }, unit, m) : amt(cur[kk]);
      return `<tr><td>${lab}</td><td class="n">${v}</td><td>${osBadge(chg(cur[kk], prev?.[kk], kk==="revenue" ? cur.revenue_yoy : kk==="operating_profit" ? cur.op_yoy : null), m)}</td>${cmp.length ? `<td>${gq ? `<span class="os-bd ${signCls(guideDiff(gq))}">${vsGuide(gq, m) || "-"}</span>` : "-"}</td>` : ""}<td class="n sm">${gf ? rangeHTML(gf, unit, m) : "-"}</td><td>${pg ? pg.ratio.toFixed(1) + "%" : "-"}</td></tr>`; }).join("");
    h += `<div class="os-sec">主要な数字 <span>${jp ? `第${qn}四半期（3か月）` : "直近の四半期（3か月）"}・通期予想は会社予想・進捗率は累計</span></div>
      <table class="os-t"><tr><th>項目</th><th>今期</th><th>前年同期比</th>${cmp.length ? "<th>ガイダンス比</th>" : ""}<th>通期予想</th><th>進捗率</th></tr>${rows}</table>`;
  }
  const notes = ["出典: 会社の決算資料と企業マスター"];
  if(segs.length) notes.push("セグメント利益は会社の開示どおりの基準で、全社の利益との差は「調整・その他」");
  if(!segs.length) notes.push("セグメントの開示がない（単一セグメントの）会社");
  h += `<div class="o-note">${notes.join("。")}。</div>`;
  return h;
}
window.__renderOne = async (key, opts={}) => {
  if(!state.masters.length){ const mm = await (await fetch("data/masters.json",{cache:"no-cache"})).json(); state.masters = mm.companies||[]; }
  const c = state.masters.find(x => [x.ticker, x.name, x.ja].includes(key)); if(!c) throw new Error("マスターに見つかりません: "+key);
  const r = rowFromMaster(c, opts.period); r.社名表示 = false; state.rows = [r];
  $("#mode").value = "one"; fillOneCo(); $("#oneCo").value = r.key; fillOnePer(); if(opts.period) $("#onePer").value = opts.period;
  if(opts.theme) $("#oneTheme").value = opts.theme;
  $("#oneLayout").value = opts.layout==="seg" ? "seg" : "";
  if(opts.chart===false) $("#oneChart").checked = false;
  $("#title").dataset.touched = opts.title ? "1" : ""; if(opts.title) $("#title").value = opts.title; else autoTitle();
  renderPreview();
  return Promise.all([...document.querySelectorAll("#canvas img")].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
};

/* ---------- プレビュー ---------- */
function renderPreview(){
  saveState();
  const mode = $("#mode").value;
  renderFxIfNeeded();
  document.querySelectorAll(".fxonly").forEach(e=>e.style.display = $("#cur").value==="jpy" ? "" : "none");
  document.querySelectorAll(".segonly").forEach(e=>e.style.display = mode==="seg" ? "" : "none");
  document.querySelectorAll(".oneonly").forEach(e=>e.style.display = mode==="one" ? "" : "none");
  if(mode==="one") fillOneCo();
  $("#count").textContent = state.rows.length ? `${state.rows.length}社を選んでいます` : "企業が選ばれていません";
  const inner = mode==="seg" ? segHTML() : mode==="one" ? oneHTML() : (state.rows.length ? tableHTML() : null);
  $("#dlBtn").disabled = !inner;
  if(!inner){ $("#stage").innerHTML = `<div class="placeholder">${mode==="seg"?"セグメント表は、企業マスターから選んだ企業（セグメントのデータがある会社）で作れます。":mode==="one"?"1社まとめは、企業マスターにある企業で作れます（ガイダンスがない会社は実績とグラフだけでまとめます）。":"左で企業を選ぶか、手入力で追加すると、ここに表ができます。"}</div>`; return; }
  $("#stage").innerHTML = `<div class="fit"><div id="canvas" class="${mode==="one" ? "one "+($("#oneTheme").value==="light"?"light":"") : ""}" style="--head:${$("#cHead").value};--accent:${$("#cAccent").value}">${inner}</div></div>`;
  if(mode==="table") document.querySelectorAll("#canvas table.et thead th").forEach((th,i)=>{   // 見出しクリックで並び替え
    if(!SORT_COL[i]) return; th.style.cursor = "pointer"; th.title = "クリックで並び替え（もう一度で逆順）";
    th.onclick = ()=>{ const k = SORT_COL[i];
      if($("#sortKey").value===k) $("#sortDir").value = $("#sortDir").value==="desc" ? "asc" : "desc";
      else { $("#sortKey").value = k; $("#sortDir").value = "desc"; }
      renderPreview(); renderEdit(); };
  });
  fit();
}
function renderFxIfNeeded(){
  const want = usedCurrencies().join(","), have = [...$("#fxBox").querySelectorAll("input")].map(i=>i.dataset.cur).join(",");
  if(want!==have || !$("#fxBox").innerHTML) renderFx();
}
function fit(){
  const f = document.querySelector(".fit"), c = $("#canvas"); if(!f||!c) return;
  const k = Math.min(1, ($("#stage").clientWidth - 36) / c.offsetWidth);
  f.style.transform = `scale(${k})`; f.style.height = (c.offsetHeight*k)+"px";
}
addEventListener("resize", fit);
function autoTitle(){
  if($("#title").dataset.touched) return;
  if($("#mode").value==="one"){
    const r = state.rows.find(x=>x.key===$("#oneCo").value) || oneRows()[0], c = r && masterOf(r);
    $("#title").value = c ? (c.ja || c.name) : "1社まとめ"; return;
  }
  if($("#mode").value==="seg"){
    const r = state.rows.find(x=>x.key===$("#segCo").value);
    $("#title").value = r ? `${logoSrc(r) ? "" : r.企業+" "}セグメント別業績（${qLabel(r.期)}）` : "セグメント別業績"; return;
  }
  const win = windowNow();
  if(win?.kind==="24") $("#title").value = `過去24時間の決算（${fmtJ(win.end)}まで）`;
  else if(win?.kind==="run") $("#title").value = `注目企業の決算（${win.run.label.replace(/（.） /," ")}）`;
  else if(win?.kind==="7d") $("#title").value = "過去7日間の決算";
  else $("#title").value = "注目企業の決算";
}
$("#title").addEventListener("input", e=>{ e.target.dataset.touched="1"; renderPreview(); });
$("#mode").addEventListener("change", ()=>{ $("#title").dataset.touched=""; fillSegCo(); fillOneCo(); autoTitle(); renderPreview(); });
$("#oneCo").addEventListener("change", ()=>{ fillOnePer(); $("#title").dataset.touched=""; autoTitle(); renderPreview(); });
["#onePer","#oneTheme","#oneChart","#oneLayout"].forEach(s=>$(s).addEventListener("change", renderPreview));
$("#segCo").addEventListener("change", ()=>{ if($("#mode").value==="seg"){ $("#title").dataset.touched=""; autoTitle(); } renderPreview(); });
["#unit","#period","#minus","#segProfit","#align","#cur","#dateShow","#sortKey","#sortDir","#colProg","#colGuide","#colNext"].forEach(s=>$(s).addEventListener("change", renderPreview));
["#sortKey","#sortDir"].forEach(s=>$(s).addEventListener("change", renderEdit));

/* ---------- PNG ---------- */
$("#dlBtn").onclick = async ()=>{
  const btn = $("#dlBtn"); btn.disabled = true; btn.textContent = "画像を作っています…";
  try{
    const url = await toPng($("#canvas"), { pixelRatio: 2, backgroundColor: getComputedStyle($("#canvas")).backgroundColor || "#fff" });
    const a = document.createElement("a"); a.href = url;
    a.download = ($("#title").value || "決算比較表").replace(/[\\/:*?"<>|]/g,"") + ".png"; a.click();
    btn.textContent = "ダウンロードしました";
  }catch(e){ btn.textContent = "画像にできませんでした。もう一度押してください"; console.error(e); }
  setTimeout(()=>{ btn.textContent = "PNGをダウンロード"; btn.disabled = false; }, 1800);
};

/* ---------- 保存・起動 ---------- */
function saveState(){
  store.set("rows2", state.rows);
  store.set("opts", { sortKey:$("#sortKey").value, sortDir:$("#sortDir").value, dateShow:$("#dateShow").value, cur:$("#cur").value, align:$("#align").value, mode:$("#mode").value, palette:$("#palette").value, head:$("#cHead").value, accent:$("#cAccent").value, title:$("#title").value, touched:!!$("#title").dataset.touched, unit:$("#unit").value, period:$("#period").value, minus:$("#minus").value, segProfit:$("#segProfit").checked, colProg:$("#colProg").checked, colGuide:$("#colGuide").checked, colNext:$("#colNext").checked });
}
/* 自動まとめ（render.py）から呼ぶ入口 */
window.__render = (rows, opts={}) => {
  state.rows = rows.map(r=>({ ...r, logoKeys:[r.企業] }));
  if(opts.title!=null){ $("#title").value = opts.title; $("#title").dataset.touched="1"; }
  if(opts.period) $("#period").value = opts.period;
  if(opts.minus) $("#minus").value = opts.minus;
  if(opts.align) $("#align").value = opts.align;
  if(opts.cur) $("#cur").value = opts.cur;
  if(opts.dateShow) $("#dateShow").value = opts.dateShow;
  $("#colProg").checked = !!opts.progress; $("#colGuide").checked = !!opts.guide; $("#colNext").checked = !!opts.next;
  $("#sortKey").value = opts.sort || ""; $("#sortDir").value = opts.sortDir || "desc";
  if(opts.fx){ state.cfg.fx = { ...(state.cfg.fx||{}), ...opts.fx }; $("#fxBox").innerHTML = ""; }
  if(opts.palette && PALETTES[opts.palette]){ $("#palette").value = opts.palette; applyPalette(); }
  if(opts.head){ $("#palette").value="custom"; $("#cHead").value = opts.head; }
  if(opts.accent){ $("#palette").value="custom"; $("#cAccent").value = opts.accent; }
  $("#mode").value = "table";
  renderPreview();
  return Promise.all([...document.querySelectorAll("#canvas img")].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
};
/* セグメント表を render.py から作る入口 */
window.__renderSeg = async (key, opts={}) => {
  if(!state.masters.length){ const m = await (await fetch("data/masters.json",{cache:"no-cache"})).json(); state.masters = m.companies||[]; }
  const c = state.masters.find(x => [x.ticker, x.name, x.ja].includes(key)); if(!c) throw new Error("マスターに見つかりません: "+key);
  const r = rowFromMaster(c, opts.period); r.社名表示 = false; state.rows = [r];
  $("#mode").value = "seg"; fillSegCo(); $("#segCo").value = r.key; $("#segProfit").checked = !!opts.profit;
  if(opts.palette && PALETTES[opts.palette]){ $("#palette").value = opts.palette; applyPalette(); }
  $("#title").dataset.touched = opts.title ? "1" : ""; if(opts.title) $("#title").value = opts.title; else autoTitle();
  renderPreview();
  return Promise.all([...document.querySelectorAll("#canvas img")].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
};
(async function init(){
  $("#palette").value="teal"; applyPalette();
  if(new URLSearchParams(location.search).has("headless")){
    try{ const r = await fetch("logos/index.json",{cache:"no-cache"}); if(r.ok) state.logos = await r.json(); }catch{}
    try{ state.cfg = await (await fetch("config.json",{cache:"no-cache"})).json(); }catch{}
    try{ const r = await fetch("data/masters.json",{cache:"no-cache"}); if(r.ok) state.masters = (await r.json()).companies||[]; }catch{}   // 総合商社の判定・進捗率に使う
    try{ const r = await fetch("data/mcap.json",{cache:"no-cache"}); if(r.ok){ const j = await r.json(); state.mcap = j.companies||{}; } }catch{}   // 決算日（期の年の判定）に使う
    window.__ready = true; return;
  }
  const o = store.get("opts");
  if(o){ $("#mode").value=o.mode||"table"; $("#title").value=o.title||""; if(o.touched) $("#title").dataset.touched="1"; $("#unit").value=o.unit||"億円"; $("#period").value=o.period||"corner"; $("#minus").value=o.minus||"△"; $("#palette").value=o.palette||"teal"; if(o.head) $("#cHead").value=o.head; if(o.accent) $("#cAccent").value=o.accent; $("#segProfit").checked=!!o.segProfit; $("#align").value=o.align||"auto"; $("#cur").value=o.cur||"local"; $("#dateShow").value=o.dateShow||"auto"; $("#sortKey").value=o.sortKey||""; $("#sortDir").value=o.sortDir||"desc"; $("#colProg").checked=!!o.colProg; $("#colGuide").checked=!!o.colGuide; $("#colNext").checked=!!o.colNext; }
  if(!$("#title").value) $("#title").value = "注目企業の決算";
  state.rows = store.get("rows2") || [];
  await loadAll();
  renderEdit(); renderPreview();
  for(const r of state.rows) if(r.key?.startsWith("m|") && !r._latest) r._latest = r.period;   // 期を手で切り替えた記録のない行は「最新の期に追従」扱い
  refreshLive(state.rows.filter(r=>r.key?.startsWith("m|")).map(masterOf).filter(Boolean));   // 前回選んだ会社も最新の期に
})();
</script>
