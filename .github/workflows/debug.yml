name: debug
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4
      - run: |
          python - > debug_out.txt 2>&1 <<'PY' || true
          import collect_logos as c, re
          for lang,t in [("en","SK Hynix"),("ko","SK하이닉스"),("ja","SKハイニックス")]:
              r=c.SESSION.get(f"https://{lang}.wikipedia.org/w/api.php",params={"action":"query","titles":t,"prop":"images|pageimages","piprop":"name","imlimit":50,"redirects":1,"format":"json"},timeout=15).json()
              for p in r["query"]["pages"].values():
                  print(lang, p.get("pageimage"), [i["title"] for i in p.get("images",[]) if re.search("logo|hynix|Hynix|SK",i["title"])])
          PY
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -f debug_out.txt && git commit -m debug && git push
