name: 時価総額の更新
on:
  schedule:
    - cron: "40 21 * * 0-4"   # 日本時間 6:40 月〜金（米国の引け後）
    - cron: "0 3 * * 1-5"     # 日本時間 12:00（その日の決算発表予定を取り込む）
    - cron: "40 6 * * 1-5"    # 日本時間 15:40（日本・アジアの引け後）
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: mcap, cancel-in-progress: false }
jobs:
  mcap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance requests
      - run: python sync_mcap.py
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/mcap.json
          git diff --cached --quiet || (git commit -m "時価総額を更新" && git pull --rebase -q && git push)
