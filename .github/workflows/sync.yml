name: 企業マスター同期
on:
  schedule:
    - cron: "15 */2 * * *"   # 2時間ごと（全社）
    - cron: "*/15 * * * *"   # 15分ごと: 決算日が直近の会社・Financialsが今日更新された会社だけ
  workflow_dispatch:
    inputs:
      only: { description: "この会社だけ取り直す（ティッカー、カンマ区切り。空なら全社）", default: "" }
  repository_dispatch:
    types: [financials-updated]   # earnings-autoupdate が Financials を書き込んだ直後に呼ぶ
permissions:
  contents: write
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl
      - name: 同期してコミット（他の同期と重なったら取り直す）
        env:
          ONLY: ${{ github.event.inputs.only || github.event.client_payload.tickers }}
          AUTO: ${{ github.event.schedule == '*/15 * * * *' && '1' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # 全社の同期は時間がかかるので、push が他の更新（時価総額など）とぶつかったら、作った masters.json を
          # 最新の main に載せ直して push し直す（同期そのものはやり直さない）。一部の会社だけの同期はすぐ終わるのでやり直す
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ -n "$AUTO" ]; then
              python sync_masters.py --auto
            elif [ -n "$ONLY" ] || [ ! -f /tmp/masters.json ]; then
              python sync_masters.py ${ONLY:+--only "$ONLY"}
              [ -z "$ONLY" ] && cp data/masters.json /tmp/masters.json
            else
              cp /tmp/masters.json data/masters.json
            fi
            python - <<'PY'
          import json, subprocess
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/masters.json"]))
          except Exception:
              old = None
          new = json.load(open("data/masters.json"))
          strip = lambda d: {k: v for k, v in d.items() if k != "updated"} if d else None
          open("/tmp/changed", "w").write("1" if strip(old) != strip(new) else "0")
          PY
            if [ "$(cat /tmp/changed)" != "1" ]; then echo "変更なし"; exit 0; fi
            git add data/masters.json && git commit -qm "企業マスターを同期${ONLY:+（$ONLY）}"
            if git push -q; then exit 0; fi
            echo "他の更新と重なったので取り直します（$attempt）"
          done
          exit 1
