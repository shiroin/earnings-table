name: 企業マスター同期
on:
  schedule:
    - cron: "15 */2 * * *"   # 2時間ごと
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests openpyxl
      - run: python sync_masters.py
      - name: 変更があればコミット（更新時刻だけの変化は無視）
        run: |
          python - <<'PY'
          import json, subprocess, sys
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:data/masters.json"]))
          except Exception:
              old = None
          new = json.load(open("data/masters.json"))
          strip = lambda d: {k: v for k, v in d.items() if k != "updated"} if d else None
          open("changed", "w").write("1" if strip(old) != strip(new) else "0")
          PY
          if [ "$(cat changed)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add data/masters.json
            git commit -m "企業マスターを同期" && git pull --rebase -q && git push
          else
            echo "変更なし"
          fi
