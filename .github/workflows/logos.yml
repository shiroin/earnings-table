name: ロゴ取得
on:
  workflow_run:
    workflows: ["企業マスター同期"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "取得済みのロゴも取り直す"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: { group: sync, cancel-in-progress: false }
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - name: ウォッチリスト（data/masters.json）の企業のロゴを取得
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then python collect_logos.py data/masters.json -o logos
          else python collect_logos.py data/masters.json -o logos --skip-existing; fi
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add logos
          git diff --cached --quiet || (git commit -m "ロゴを更新" && git pull --rebase -q && git push)
